name: Demo Apps CI

on:
  push:
    branches:
      - develop
      - staging
      - fdx-account-consent-v1
  pull_request:
    branches:
      - develop
      - staging
      - fdx-account-consent-v1

jobs:
  client-demo-app:
    name: client/demo-app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/demo-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: FinaticORG/FinaticClientSDK
          ref: fdx-account-consent-v1
          path: sdks/FinaticClientSDK

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            client/demo-app/package-lock.json
            sdks/FinaticClientSDK/package-lock.json

      - name: Build Client SDK
        working-directory: sdks/FinaticClientSDK
        run: npm ci && npm run build

      - name: Configure local SDK path
        run: echo "@finatic/client:file:../../sdks/FinaticClientSDK" > .npmrc

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

  simple-demo-app:
    name: client/simple-demo-app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/simple-demo-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: FinaticORG/FinaticClientSDK
          ref: fdx-account-consent-v1
          path: sdks/FinaticClientSDK

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            client/simple-demo-app/package-lock.json
            sdks/FinaticClientSDK/package-lock.json

      - name: Build Client SDK
        working-directory: sdks/FinaticClientSDK
        run: npm ci && npm run build

      - name: Configure local SDK path
        run: echo "@finatic/client:file:../../sdks/FinaticClientSDK" > .npmrc

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

  server-node-demo:
    name: server-node/demo-app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server-node/demo-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: FinaticORG/FinaticServerSDK-Node
          ref: fdx-account-consent-v1
          path: sdks/FinaticServerSDK-Node

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            server-node/demo-app/package-lock.json
            sdks/FinaticServerSDK-Node/package-lock.json

      - name: Build Server Node SDK
        working-directory: sdks/FinaticServerSDK-Node
        run: npm ci && npm run build

      - name: Configure local SDK path
        run: echo "@finatic/server-node:file:../../sdks/FinaticServerSDK-Node" > .npmrc

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
